services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_recycling
      POSTGRES_USER: smart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart -d smart_recycling"]
      interval: 5s
      retries: 12
  api:
    build: ./app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://smart:${POSTGRES_PASSWORD}@db:5432/smart_recycling
      DEVICE_KEY: ${DEVICE_KEY}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      ROOT_PATH: /smart_recycling
      LOGIN_USER: ${LOGIN_USER:-admin}
      LOGIN_PASSWORD_HASH: ${LOGIN_PASSWORD_HASH}
      SIMULATION_MODE: ${SIMULATION_MODE:-false}
    ports:
      - "127.0.0.1:${SMART_RECYCLING_PORT:-18080}:8000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:18081:3000"
    mem_limit: 384m
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/smart_recycling/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
  simulator:
    profiles: [development]
    build: ./simulator
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
      DEVICE_KEY: ${DEVICE_KEY}
      SIMULATION_MODE: ${SIMULATION_MODE:-false}
    depends_on:
      - api
volumes:
  postgres_data:
